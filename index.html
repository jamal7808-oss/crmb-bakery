<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CRMB — نظام محاسبة المخابز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
/* ===== THEME VARIABLES ===== */
:root {
 --bg: #f4f6f9;
 --bg2: #ffffff;
 --bg3: #f0f2f5;
 --sidebar-bg: #ffffff;
 --header-bg: #ffffff;
 --border: #e8ecf0;
 --text: #1a202c;
 --text2: #6b7280;
 --text3: #9ca3af;
 --primary: #f97316;
 --primary-light: #fff7ed;
 --primary-dark: #ea6c0a;
 --green: #10b981;
 --green-light: #ecfdf5;
 --red: #ef4444;
 --red-light: #fef2f2;
 --blue: #3b82f6;
 --blue-light: #eff6ff;
 --purple: #8b5cf6;
 --purple-light: #f5f3ff;
 --orange: #f59e0b;
 --orange-light: #fffbeb;
 --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
 --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
 --shadow-lg: 0 10px 15px rgba(0,0,0,.08), 0 4px 6px rgba(0,0,0,.04);
 --radius: 12px;
 --radius-sm: 8px;
 --radius-lg: 16px;
}
[data-theme="dark"] {
 --bg: #0f1117;
 --bg2: #1a1d27;
 --bg3: #22263a;
 --sidebar-bg: #1a1d27;
 --header-bg: #1a1d27;
 --border: #2d3148;
 --text: #e8eaf0;
 --text2: #9ca3af;
 --text3: #6b7280;
 --primary: #f97316;
 --primary-light: #1a1200;
 --green: #10b981;
 --green-light: #052e1a;
 --red: #ef4444;
 --red-light: #1f0808;
 --blue: #3b82f6;
 --blue-light: #0a1628;
 --purple: #8b5cf6;
 --purple-light: #150d2e;
 --orange: #f59e0b;
 --orange-light: #1a1200;
 --shadow: 0 1px 3px rgba(0,0,0,.4);
 --shadow-md: 0 4px 6px rgba(0,0,0,.3);
 --shadow-lg: 0 10px 15px rgba(0,0,0,.4);
}

/* ===== RESET ===== */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Cairo','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
button,input,select,textarea{font-family:inherit;outline:none;}
button{cursor:pointer;}
input:focus,select:focus,textarea:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(249,115,22,.1);}

/* ===== HEADER ===== */
#header{
 background:var(--header-bg);
 border-bottom:1px solid var(--border);
 padding:0 24px;
 display:flex;align-items:center;justify-content:space-between;
 height:64px;position:sticky;top:0;z-index:100;
 box-shadow:var(--shadow);
}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.logo-icon{width:36px;height:36px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:900;}
.logo-title{font-size:16px;font-weight:800;color:var(--text);}
.logo-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.header-right{display:flex;align-items:center;gap:8px;}
.header-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 14px;color:var(--text2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:all .15s;}
.header-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border);}
.header-btn.active{background:var(--bg3);color:var(--text);border-color:var(--border);}
.sync-badge{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 12px;color:var(--green);font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;}
.sync-badge.syncing{background:var(--bg3);color:var(--text2);border-color:var(--border);}
.sync-badge.offline{background:var(--bg3);color:var(--red);border-color:var(--border);}
.user-chip{background:var(--primary);color:#fff;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;border:none;}
.month-select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:7px 12px;font-size:13px;}
.theme-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:16px;transition:all .15s;}
.theme-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border);}

/* ===== LAYOUT ===== */
#layout{display:flex;min-height:calc(100vh - 64px);}

/* ===== SIDEBAR ===== */
#sidebar{
 width:220px;flex-shrink:0;
 background:var(--sidebar-bg);
 border-left:1px solid var(--border);
 padding:16px 0;
 position:sticky;top:64px;
 height:calc(100vh - 64px);
 overflow-y:auto;
 box-shadow:var(--shadow);
}
.nav-section-label{
 padding:6px 20px;
 color:var(--text3);
 font-size:10px;font-weight:700;
 letter-spacing:1.2px;
 text-transform:uppercase;
 margin-top:8px;
}
.nav-item{
 width:100%;background:transparent;border:none;
 display:flex;align-items:center;gap:10px;
 padding:10px 20px;
 color:var(--text2);font-size:13px;font-weight:500;
 text-align:right;border-radius:0;
 position:relative;transition:all .15s;
 cursor:pointer;
}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{
 background:var(--primary-light);
 color:var(--primary);font-weight:700;
}
.nav-item.active::before{
 content:'';position:absolute;right:0;top:4px;bottom:4px;
 width:3px;background:var(--primary);border-radius:3px 0 0 3px;
}
.nav-icon{
 width:32px;height:32px;border-radius:var(--radius-sm);
 display:flex;align-items:center;justify-content:center;
 font-size:16px;flex-shrink:0;
 background:var(--bg3);transition:all .15s;
}
.nav-item.active .nav-icon{background:var(--bg);}
.nav-item:hover .nav-icon{background:var(--bg);}
.nav-divider{border-bottom:1px solid var(--border);margin:8px 16px;}
.nav-logout{color:var(--red)!important;}
.nav-logout:hover{background:var(--red-light)!important;}

/* ===== MAIN CONTENT ===== */
#main{flex:1;padding:24px;overflow-y:auto;min-width:0;}

/* ===== PAGE HEADER ===== */
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:22px;font-weight:800;color:var(--text);}
.page-subtitle{font-size:13px;color:var(--text3);margin-top:2px;}
.page-actions{display:flex;gap:8px;align-items:center;}

/* ===== BUTTONS ===== */
.btn{border:none;border-radius:var(--radius-sm);font-weight:600;font-size:13px;padding:9px 18px;display:inline-flex;align-items:center;gap:6px;transition:all .15s;cursor:pointer;}
.btn:hover{opacity:.9;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-success{background:var(--green);color:#fff;}
.btn-danger{background:var(--red);color:#fff;}
.btn-info{background:var(--blue);color:#fff;}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
.btn-warning{background:var(--orange);color:#fff;}
.btn-purple{background:var(--purple);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}

/* ===== KPI CARDS ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px;}
.kpi-card{
 background:var(--bg2);border:1px solid var(--border);
 border-radius:var(--radius);padding:20px;
 box-shadow:var(--shadow);
 position:relative;overflow:hidden;
 transition:box-shadow .15s;
}
.kpi-card:hover{box-shadow:var(--shadow-md);}
.kpi-card-icon{
 width:44px;height:44px;border-radius:var(--radius-sm);
 display:flex;align-items:center;justify-content:center;
 font-size:20px;margin-bottom:12px;
}
.kpi-card-label{font-size:12px;color:var(--text3);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.kpi-card-value{font-size:22px;font-weight:800;color:var(--text);line-height:1.2;}
.kpi-card-sub{font-size:11px;color:var(--text3);margin-top:4px;}
.kpi-card-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;margin-top:6px;}
.badge-green{background:var(--bg3);color:var(--green);}
.badge-red{background:var(--bg3);color:var(--red);}
.badge-orange{background:var(--bg3);color:var(--orange);}
.badge-blue{background:var(--bg3);color:var(--blue);}

/* ===== CARDS ===== */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.card-title{font-size:15px;font-weight:700;color:var(--text);}
.card-body{padding:20px;}

/* ===== TABLE ===== */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--bg3);}
thead th{padding:12px 16px;color:var(--text3);font-size:11px;font-weight:700;text-align:right;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:hover td{background:var(--bg3);}
tbody tr:last-child{border-bottom:none;}
tbody td{padding:12px 16px;font-size:13px;color:var(--text);vertical-align:middle;}
.td-muted{color:var(--text3)!important;}
.td-mono{font-family:monospace;font-size:12px;}

/* ===== STATUS BADGES ===== */
.status{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;}
.status-green{background:var(--bg3);color:var(--green);}
.status-red{background:var(--bg3);color:var(--red);}
.status-orange{background:var(--bg3);color:var(--orange);}
.status-blue{background:var(--bg3);color:var(--blue);}
.status-purple{background:var(--bg3);color:var(--purple);}

/* ===== POS ===== */
.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:20px;}
.pos-cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;}
.pos-cat-btn{background:var(--bg2);border:1px solid var(--border);border-radius:20px;color:var(--text2);padding:7px 18px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .15s;}
.pos-cat-btn:hover{border-color:var(--primary);color:var(--primary);}
.pos-cat-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.pos-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;max-height:calc(100vh - 320px);overflow-y:auto;}
.pos-tile{
 background:var(--bg2);border:2px solid var(--border);
 border-radius:var(--radius);padding:16px 12px;
 text-align:center;cursor:pointer;transition:all .15s;
 display:flex;flex-direction:column;align-items:center;gap:6px;
}
.pos-tile:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-2px);}
.pos-tile:active{transform:scale(.97);}
.pos-tile-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;}
.pos-tile-cat{font-size:11px;color:var(--text3);}
.pos-tile-price{font-size:16px;font-weight:800;color:var(--primary);}
.cart-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;gap:0;overflow:hidden;box-shadow:var(--shadow);}
.cart-header{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;color:var(--text);display:flex;justify-content:space-between;align-items:center;}
.cart-list{flex:1;overflow-y:auto;max-height:280px;}
.cart-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.cart-item-name{font-size:13px;font-weight:600;color:var(--text);flex:1;}
.cart-item-price{font-size:12px;color:var(--text3);}
.qty-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .1s;}
.qty-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.cart-totals{padding:14px 18px;border-top:1px solid var(--border);background:var(--bg3);}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;color:var(--text2);}
.cart-total-final{font-size:18px;font-weight:800;color:var(--text);border-top:2px solid var(--border);padding-top:10px;margin-top:6px;}
.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px;border-top:1px solid var(--border);}
.pay-btn{padding:12px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--bg2);color:var(--text2);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;text-align:center;}
.pay-btn.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);}
.pay-btn:hover{border-color:var(--primary);}
.complete-btn{margin:14px 18px;border-radius:var(--radius-sm);background:var(--primary);color:#fff;border:none;padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:calc(100% - 36px);transition:all .15s;}
.complete-btn:hover{background:var(--primary-dark);transform:translateY(-1px);}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px);}
.modal-box{background:var(--bg2);border-radius:var(--radius-lg);padding:28px;width:100%;max-width:480px;border:1px solid var(--border);max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.form-field{margin-bottom:14px;}
.form-label{display:block;color:var(--text2);font-size:12px;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.form-input{background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:10px 13px;width:100%;font-size:14px;transition:all .15s;}
.form-input:focus{background:var(--bg2);border-color:var(--primary);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-actions{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.info-box{background:var(--primary-light);border:1px solid rgba(249,115,22,.2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--primary);}

/* ===== PROGRESS BAR ===== */
.prog-bar{background:var(--bg3);border-radius:20px;height:6px;overflow:hidden;}
.prog-fill{border-radius:20px;height:6px;transition:width 1s;}

/* ===== BAR CHART ===== */
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:100px;}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar-fill{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .8s;}
.bar-lbl{font-size:10px;color:var(--text3);text-align:center;}
.bar-val{font-size:10px;color:var(--text3);}

/* ===== NOTIFICATION ===== */
#notif{position:fixed;top:20px;left:50%;transform:translateX(-50%);border-radius:var(--radius);padding:12px 24px;z-index:9999;font-size:14px;font-weight:600;display:none;box-shadow:var(--shadow-lg);animation:slideDown .2s ease;}
@keyframes slideDown{from{transform:translateX(-50%) translateY(-10px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}

/* ===== GRID LAYOUTS ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

/* ===== PRODUCT CARDS (barcode) ===== */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.product-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .15s;}
.product-card:hover{box-shadow:var(--shadow-md);}
.product-card-head{background:var(--bg3);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.product-card-body{padding:12px;background:#fff;display:flex;justify-content:center;}
.product-card-stats{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border);}
.stat-item{text-align:center;}
.stat-label{color:var(--text3);font-size:10px;margin-bottom:2px;font-weight:600;}
.stat-value{font-weight:700;font-size:13px;color:var(--text);}
.product-card-actions{padding:10px 14px;display:flex;gap:7px;}

/* ===== DELIVERY CARDS ===== */
.order-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);transition:box-shadow .15s;}
.order-card:hover{box-shadow:var(--shadow-md);}
.user-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;box-shadow:var(--shadow);}

/* ===== P&L ===== */
.pnl-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.pnl-total{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:2px solid var(--border);font-weight:700;font-size:14px;}

/* ===== BOTTOM NAV (mobile) ===== */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bg2);border-top:1px solid var(--border);grid-template-columns:repeat(4,1fr);height:60px;box-shadow:0 -2px 10px rgba(0,0,0,.08);}
.bnav-btn{background:transparent;border:none;color:var(--text3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;padding:4px 0;transition:color .2s;}
.bnav-btn.active{color:var(--primary);}
.bnav-btn span:first-child{font-size:20px;}
#more-nav{background:var(--bg2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;position:fixed;bottom:60px;left:0;right:0;padding:16px;display:none;grid-template-columns:repeat(4,1fr);gap:10px;border:1px solid var(--border);border-bottom:none;z-index:199;box-shadow:var(--shadow-lg);}
.bnav-more-btn{background:var(--bg3);border:none;border-radius:var(--radius-sm);color:var(--text2);padding:12px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}

@media(max-width:768px){
 #sidebar{display:none;}
 #main{padding:16px;padding-bottom:80px;}
 #bottom-nav{display:grid;}
 .kpi-grid{grid-template-columns:1fr 1fr;}
 .form-row{grid-template-columns:1fr;}
 .pos-layout{grid-template-columns:1fr;}
 .pos-products{grid-template-columns:repeat(3,1fr);max-height:none;}
 .grid-2,.grid-3{grid-template-columns:1fr;}
 #header{padding:0 14px;}
 .page-title{font-size:18px;}
}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-state-icon{font-size:48px;margin-bottom:12px;}
.empty-state-text{font-size:14px;font-weight:600;}
.empty-state-sub{font-size:12px;margin-top:4px;}

/* Logo filter for themes */


/* Logo */
#logoImg { display:block; transition:filter .2s; }
[data-theme="light"] #logoImg { filter: invert(1); }
[data-theme="dark"] #logoImg { filter: none; }
</style>
</head>
<body>
<div id="notif"></div>

<script>
// ===== LANGUAGE SYSTEM =====
const L = (()=>{ try{return localStorage.getItem('crmb_lang')||'ar';}catch(e){return 'ar';} })();
const t = (a,e) => L==='ar' ? a : e;
document.documentElement.dir = L==='ar'?'rtl':'ltr';
document.documentElement.lang = L;

// ===== THEME =====
let THEME = 'light';
try{ THEME = localStorage.getItem('crmb_theme')||'light'; }catch(e){}
document.documentElement.setAttribute('data-theme', THEME);
function toggleTheme(){
 THEME = THEME==='light'?'dark':'light';
 try{localStorage.setItem('crmb_theme',THEME);}catch(e){}
 document.documentElement.setAttribute('data-theme', THEME);
 const btn=document.getElementById('themeBtn');
 if(btn) btn.textContent = THEME==='dark'?'':'';
}
function setLang(l){ try{localStorage.setItem('crmb_lang',l);}catch(e){} window.location.reload(); }

// Apply nav/UI translations after DOM loads
document.addEventListener('DOMContentLoaded',()=>{
 // Lang button
 const lb=document.getElementById('langBtn');
 if(lb) lb.textContent=L==='ar'?'EN':'عر';
 const tb=document.getElementById('themeBtn');
 if(tb) tb.textContent=THEME==='dark'?'':'';
 // Nav button spans
 document.querySelectorAll('[data-ar][data-en]').forEach(el=>{
 el.textContent = L==='ar'?el.dataset.ar:el.dataset.en;
 });
 // Section labels
 const nsMap={
 'ns-main':{ar:'الرئيسية',en:'MAIN'},
 'ns-mgmt':{ar:'الإدارة',en:'MANAGEMENT'},
 'ns-sys':{ar:'النظام',en:'SYSTEM'}
 };
 Object.entries(nsMap).forEach(([id,v])=>{
 const el=document.getElementById(id);
 if(el) el.textContent=L==='ar'?v.ar:v.en;
 });
 // Logo subtitle
 const sub=document.querySelector('.logo-sub');
 if(sub) sub.textContent=t('نظام محاسبة المخابز','Bakery Management System');
});
// STATE
let appData=null,currentUser=null,currentTab='dashboard',moreOpen=false,saveTimer=null,syncStatus='syncing';
let posSelectedCat=t('الكل','All'),cart=[],paymentMethod='cash',deliveryPlatform=t('الكل','All');

const MONTHS=["2025-01","2025-02","2025-03","2025-04","2025-05","2025-06","2025-07","2025-08","2025-09","2025-10","2025-11","2025-12","2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09","2026-10","2026-11","2026-12","2027-01","2027-02","2027-03","2027-04","2027-05","2027-06"];
const MN=["","يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const ml=m=>{const[y,mo]=m.split('-');return`${MN[+mo]} ${y}`;};
const fc=n=>new Intl.NumberFormat(L==='ar'?'ar-SA':'en-US',{style:'currency',currency:'SAR',minimumFractionDigits:2}).format(n||0);
const VAT=0.15;

// API
async function apiFetch(url,opts={}){
 try{
 const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});
 if(r.status===401) return {_401:true};
 return r.json();
 }catch(e){return null;}
}
async function loadData(){
 const d=await apiFetch('/api/data');
 if(d&&!d._401){appData=d;setSyncBadge('online');return true;}
 setSyncBadge('offline');return false;
}
async function saveData(){
 setSyncBadge('syncing');
 const r=await apiFetch('/api/data',{method:'POST',body:JSON.stringify(appData)});
 setSyncBadge(r?.ok?'online':'offline');
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveData,800);}

function setSyncBadge(s){
 syncStatus=s;
 const b=document.getElementById('syncBadge');if(!b)return;
 const m={online:t(' متزامن',' Synced'),syncing:t(' جاري الحفظ',' Saving'),offline:t(' غير متصل',' Offline')};
 b.textContent=m[s]||m.syncing;
 b.className='sync-badge'+(s==='syncing'?' syncing':s==='offline'?' offline':'');
}

function setLoadMsg(m){const e=document.getElementById('loadMsg');if(e)e.textContent=m;}

// INIT
async function init(){
 let attempt=0;
 const tryConnect=async()=>{
 attempt++;
 setLoadMsg(t('محاولة ','Attempt ')+attempt+'...');
 const me=await apiFetch('/api/me');
 if(me===null){setTimeout(tryConnect,4000);return;}
 if(me._401){window.location.href='/login';return;}
 currentUser=me;
 document.getElementById('userBadge').textContent=' '+currentUser.name;
 const ok=await loadData();
 if(!ok){setTimeout(tryConnect,4000);return;}
 const sel=document.getElementById('monthSelect');
 sel.innerHTML=MONTHS.map(m=>`<option value="${m}" ${m===appData.currentMonth?'selected':''}>${ml(m)}</option>`).join('');
 renderMain();
 setInterval(async()=>{const old=JSON.stringify(appData);if(await loadData()&&JSON.stringify(appData)!==old)renderMain();},15000);
 setInterval(()=>{if(currentTab==='users')loadUsersList();},3000);
 };
 tryConnect();
}

// NAV
function showTab(t){
 currentTab=t;
 document.querySelectorAll('.nav-item,.bnav-btn').forEach(b=>b.classList.remove('active'));
 const nb=document.getElementById('nav-'+t);if(nb)nb.classList.add('active');
 const bb=document.getElementById('bnav-'+t);if(bb)bb.classList.add('active');
 if(moreOpen)toggleMore();
 renderMain();
 if(t==='barcode')setTimeout(drawAllBarcodes,80);
 if(t==='pos')setTimeout(()=>{const i=document.getElementById('scanInput');if(i)i.focus();},80);
}
function toggleMore(){
 moreOpen=!moreOpen;
 const m=document.getElementById('more-nav');
 if(m)m.style.display=moreOpen?'grid':'none';
}
function changeMonth(v){appData.currentMonth=v;scheduleSave();renderMain();}

// HELPERS
const kpiColors={
 'var(--green)':{icon:'kpi-card-icon" style="background:var(--green-light)',badge:'badge-green'},
 'var(--red)':{icon:'kpi-card-icon" style="background:var(--red-light)',badge:'badge-red'},
 'var(--blue)':{icon:'kpi-card-icon" style="background:var(--blue-light)',badge:'badge-blue'},
 'var(--orange)':{icon:'kpi-card-icon" style="background:var(--orange-light)',badge:'badge-orange'},
 'var(--purple)':{icon:'kpi-card-icon" style="background:var(--purple-light)',badge:'badge-purple'},
 'var(--gold)':{icon:'kpi-card-icon" style="background:var(--primary-light)',badge:'badge-orange'},
};
const kpi=(l,v,icon,c,sub='')=>{
 const cc=kpiColors[c]||{icon:'kpi-card-icon" style="background:var(--bg3)',badge:'badge-blue'};
 return `<div class="kpi-card"><div class="${cc.icon}">${icon}</div><div class="kpi-card-label">${l}</div><div class="kpi-card-value" style="color:${c}">${v}</div>${sub?`<div class="kpi-card-badge ${cc.badge}">${sub}</div>`:''}</div>`;
};
const gv=id=>(document.getElementById(id)||{}).value||'';
const gn=id=>parseFloat((document.getElementById(id)||{}).value)||0;

function calcStats(){
 const cm=appData.currentMonth;
 const totalSalaries=appData.employees.reduce((s,e)=>s+e.salary+e.housing,0);
 const totalRaw=appData.rawMaterials.filter(r=>r.month===cm).reduce((s,r)=>s+r.qty*r.unitCost,0);
 const totalExp=appData.expenses.filter(e=>e.month===cm).reduce((s,e)=>s+e.amount,0);
 const totalRev=appData.revenue.filter(r=>r.month===cm).reduce((s,r)=>s+r.amount,0);
 const totalCosts=totalSalaries+totalRaw+totalExp+appData.rent.amount;
 const netProfit=totalRev-totalCosts;
 const margin=totalRev>0?((netProfit/totalRev)*100).toFixed(1):0;
 return{totalSalaries,totalRaw,totalExp,totalRev,totalCosts,netProfit,margin,cm};
}

function renderMain(){
 const main=document.getElementById('main');
 if(!main||!appData)return;
 const s=calcStats();
 const renders={
 dashboard:()=>renderDashboard(s),pos:()=>renderPOS(),
 products:()=>renderProducts(),purchases:()=>renderPurchases(),
 delivery:()=>renderDelivery(),sales:()=>renderSales(),
 revenue:()=>renderRevenue(s),materials:()=>renderMaterials(s),
 employees:()=>renderEmployees(s),expenses:()=>renderExpenses(s),
 equipment:()=>renderEquipment(),rent:()=>renderRent(s),
 reports:()=>renderReports(s),barcode:()=>renderBarcode(),
 users:()=>renderUsers(),profile:()=>renderProfile(),
 };
 try{main.innerHTML=(renders[currentTab]||renders.dashboard)();}
 catch(e){main.innerHTML=`<div style="padding:40px;color:var(--red);text-align:center"><div style="font-size:32px;margin-bottom:12px"></div><div style="font-weight:700;margin-bottom:8px">خطأ في التطبيق</div><div style="color:#888;font-size:13px">${e.message}</div></div>`;console.error(e);}
 if(currentTab==='barcode')setTimeout(drawAllBarcodes,80);
}

// DASHBOARD
function renderDashboard(s){
 const ri=appData.revenue.filter(r=>r.month===s.cm);
 const mx=Math.max(...ri.map(r=>r.amount),1);
 return`<div class="page-header"><div class="page-title"> لوحة التحكم — ${ml(s.cm)}</div></div>
 <div class="kpi-grid">
 ${kpi(t('إجمالي الإيرادات','Total Revenue'),fc(s.totalRev),'','var(--green)',t('هذا الشهر','This Month'))}
 ${kpi(t('إجمالي التكاليف','Total Costs'),fc(s.totalCosts),'','var(--red)','')}
 ${kpi(s.netProfit>=0?t("صافي الربح","Net Profit"):t("صافي الخسارة","Net Loss"),fc(Math.abs(s.netProfit)),'',s.netProfit>=0?'var(--green)':'var(--red)',`هامش ${s.margin}%`)}
 ${kpi(t('الرواتب والسكن','Salaries & Housing'),fc(s.totalSalaries),'','var(--blue)',appData.employees.length+t(' موظف',' employees'))}
 ${kpi(t('المواد الخام','Raw Materials'),fc(s.totalRaw),'','var(--orange)','')}
 ${kpi(t('الإيجار','Rent'),fc(appData.rent.amount),'','var(--purple)','')}
 </div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px">
 <div style="background:var(--bg2);border-radius:14px;padding:18px;border:1px solid var(--border)">
 <div style="color:var(--gold);font-weight:700;margin-bottom:14px;font-size:14px">${t("توزيع التكاليف","Cost Distribution")}</div>
 ${[{l:t("رواتب","Salaries"),v:s.totalSalaries,c:'var(--blue)'},{l:t("مواد خام","Raw Materials"),v:s.totalRaw,c:'var(--orange)'},{l:t("إيجار","Rent"),v:appData.rent.amount,c:'var(--purple)'},{l:t("مصاريف","Expenses"),v:s.totalExp,c:'var(--red)'}].map(i=>{const p=s.totalCosts>0?((i.v/s.totalCosts)*100).toFixed(1):0;return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;color:#bbb">${i.l}</span><span style="font-size:12px;color:${i.c};font-weight:600">${fc(i.v)}</span></div><div class="prog-bar"><div class="prog-fill" style="width:${p}%;background:${i.c}"></div></div></div>`;}).join('')}
 </div>
 <div style="background:var(--bg2);border-radius:14px;padding:18px;border:1px solid var(--border)">
 <div style="color:var(--gold);font-weight:700;margin-bottom:14px;font-size:14px">${t("الإيرادات","Revenue")}</div>
 <div class="bar-chart">${ri.length===0?'<p style="color:#555;font-size:12px;margin:auto">'+t('لا توجد إيرادات','No revenue yet')+'</p>':ri.map(r=>`<div class="bar-item"><div class="bar-val">${(r.amount/1000).toFixed(0)}k</div><div class="bar-fill" style="height:${(r.amount/mx*75)}px;background:var(--green)"></div><div class="bar-lbl">${r.source}</div></div>`).join('')}</div>
 </div>
 </div>
 <div style="background:var(--bg2);border-radius:14px;padding:18px;border:1px solid var(--border)">
 <div style="color:var(--gold);font-weight:700;margin-bottom:14px;font-size:14px">${t("ملخص الشهر","Monthly Summary")}</div>
 <div class="table-wrap"><table><thead><tr><th>البند</th><th>المبلغ</th><th>النسبة</th></tr></thead><tbody>
 <tr><td style="font-weight:700">إجمالي الإيرادات</td><td style="color:var(--green);font-weight:700">${fc(s.totalRev)}</td><td style="color:var(--green)">100%</td></tr>
 <tr><td>رواتب وسكن</td><td style="color:var(--red)">${fc(s.totalSalaries)}</td><td style="color:#888">${s.totalRev>0?((s.totalSalaries/s.totalRev)*100).toFixed(1)+'%':'-'}</td></tr>
 <tr><td>مواد خام</td><td style="color:var(--red)">${fc(s.totalRaw)}</td><td style="color:#888">${s.totalRev>0?((s.totalRaw/s.totalRev)*100).toFixed(1)+'%':'-'}</td></tr>
 <tr><td>إيجار</td><td style="color:var(--red)">${fc(appData.rent.amount)}</td><td style="color:#888">${s.totalRev>0?((appData.rent.amount/s.totalRev)*100).toFixed(1)+'%':'-'}</td></tr>
 <tr><td>مصاريف تشغيل</td><td style="color:var(--red)">${fc(s.totalExp)}</td><td style="color:#888">${s.totalRev>0?((s.totalExp/s.totalRev)*100).toFixed(1)+'%':'-'}</td></tr>
 <tr><td style="font-weight:700">${s.netProfit>=0?t('صافي الربح','Net Profit'):t('صافي الخسارة','Net Loss')}</td><td style="color:${s.netProfit>=0?'var(--green)':'var(--red)'};font-weight:700">${fc(Math.abs(s.netProfit))}</td><td style="color:${s.netProfit>=0?'var(--green)':'var(--red)'}">${s.margin}%</td></tr>
 </tbody></table></div>
 </div>`;
}

// POS

function renderRecentSales(sales){
 const saleLabel = L==='ar'?'بيع':'Sale';
 const noSales = L==='ar'?'لا توجد مبيعات':'No sales yet';
 const items = sales.slice(-5).reverse().map(s=>{
 const label = s.note||s.category||saleLabel;
 const pay = s.payMethod==='mada'?'':'';
 return '<div style="display:flex;justify-content:space-between;padding:7px 14px;border-bottom:1px solid #1a1a1a;font-size:12px">'
 +'<span style="color:#888">'+label+' '+pay+'</span>'
 +'<span style="color:var(--green);font-weight:600">'+fc(s.amount)+'</span>'
 +'</div>';
 }).join('');
 return items || '<div style="color:#444;text-align:center;padding:14px;font-size:12px">'+noSales+'</div>';
}

function renderPOS(){
 const prods=appData.products||[];
 const cats=[t('الكل','All'),...[...new Set(prods.map(p=>p.category))]];
 const filtered=posSelectedCat===t('الكل','All')?prods:prods.filter(p=>p.category===posSelectedCat);
 const today=new Date().toISOString().split('T')[0];
 const todaySales=(appData.dailySales||[]).filter(s=>s.date===today);
 const todayTotal=todaySales.reduce((a,s)=>a+s.amount,0);
 return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
 <div class="page-title"> نقطة البيع</div>
 <div style="display:flex;gap:8px;align-items:center">
 <div style="background:#1a2a1a;border:1px solid #27ae6040;border-radius:8px;padding:4px 12px;color:#27ae60;font-size:12px">مبيعات اليوم: ${fc(todayTotal)}</div>
 <button class="btn btn-red btn-sm" onclick="clearCart()">مسح السلة</button>
 </div>
 </div>
 <div class="pos-layout">
 <div style="display:flex;flex-direction:column;gap:10px">
 <div style="display:flex;gap:8px">
 <input class="form-input" id="scanInput" placeholder="امسح الباركود أو ابحث..." style="flex:1" onkeydown="if(event.key==='Enter')scanBarcode()" oninput="filterPOSTiles(this.value)">
 <button class="btn btn-primary" onclick="scanBarcode()" style="padding:10px 14px">بحث</button>
 </div>
 <div class="pos-cats">${cats.map(c=>`<button class="pos-cat-btn ${c===posSelectedCat?'active':''}" onclick="setPOSCat('${c}')">${c}</button>`).join('')}</div>
 <div class="pos-products" id="posGrid">
 ${filtered.length===0?`<div style="grid-column:1/-1;text-align:center;color:#444;padding:40px">${t("لا توجد منتجات","No products yet")}</div>`:
 filtered.map(p=>`<div class="pos-tile" onclick="addToCart(${p.id})">
 <div class="pos-tile-name">${p.name}</div>
 <div class="pos-tile-cat">${p.category}</div>
 <div class="pos-tile-price">${fc(p.price)}</div>
 <div style="font-size:10px;color:#555;margin-top:2px">شامل ض.ق.م</div>
 </div>`).join('')}
 </div>
 </div>
 <div style="display:flex;flex-direction:column;gap:10px">
 <div class="cart-list" id="cartItems"><div style="text-align:center;color:#444;padding:40px;font-size:13px">${t('السلة فارغة','Cart Empty')}<br><span style="font-size:11px;color:#333">${t('اضغط على المنتج','Tap a product')}</span></div></div>
 <div style="background:#111;border-radius:12px;padding:14px;border:1px solid #222">
 <div class="pnl-row"><span style="color:#aaa;font-size:12px">المجموع قبل الضريبة</span><span id="posSubtotal" style="font-size:12px">0.00</span></div>
 <div class="pnl-row"><span style="color:#aaa;font-size:12px">ضريبة ق.م 15%</span><span id="posVat" style="color:var(--orange);font-size:12px">0.00</span></div>
 <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:2px solid #333;margin-top:4px">
 <span style="font-weight:700">الإجمالي</span>
 <span id="posTotal" style="font-size:22px;font-weight:900;color:var(--green)">0.00</span>
 </div>
 </div>
 <div style="background:#111;border-radius:12px;padding:12px;border:1px solid #222">
 <div style="color:#aaa;font-size:12px;margin-bottom:8px">طريقة الدفع</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
 <button id="payBtn-cash" class="btn btn-success" onclick="setPayment('cash')" style="padding:12px"> نقدي</button>
 <button id="payBtn-mada" class="btn btn-secondary" onclick="setPayment('mada')" style="padding:12px;border:1px solid #333"> مدى</button>
 </div>
 <button class="btn btn-success" onclick="completeSale()" style="width:100%;padding:16px;font-size:16px;font-weight:700;border-radius:12px;margin-bottom:6px"> إتمام البيع</button>
 <button class="btn btn-secondary" onclick="printReceipt()" style="width:100%;padding:10px;font-size:12px;border-radius:10px"> طباعة الفاتورة</button>
 </div>
 <div style="background:#111;border-radius:12px;border:1px solid #222;overflow:hidden">
 <div style="padding:8px 14px;border-bottom:1px solid #1a1a1a;color:#666;font-size:12px">${t("آخر مبيعات اليوم","Recent Sales")}</div>
 <div>${renderRecentSales(todaySales)}</div>
 </div>
 </div>
 </div>`;
}

function setPOSCat(c){posSelectedCat=c;renderMain();setTimeout(()=>{const i=document.getElementById('scanInput');if(i)i.focus();},80);}
function filterPOSTiles(q){
 const g=document.getElementById('posGrid');if(!g)return;
 const prods=(appData.products||[]).filter(p=>posSelectedCat===t('الكل','All')||p.category===posSelectedCat);
 const f=q?prods.filter(p=>p.name.includes(q)||(p.barcode||'').includes(q)):prods;
 if(!f.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#444;padding:30px">'+t('لا توجد نتائج','No results')+'</div>';return;}
 g.innerHTML=f.map(p=>`<div class="pos-tile" onclick="addToCart(${p.id})"><div class="pos-tile-name">${p.name}</div><div class="pos-tile-cat">${p.category}</div><div class="pos-tile-price">${fc(p.price)}</div><div style="font-size:10px;color:#555;margin-top:2px">شامل ض.ق.م</div></div>`).join('');
}
function addToCart(id){
 const p=(appData.products||[]).find(x=>x.id===id);if(!p)return;
 const e=cart.find(c=>c.id===id);if(e)e.qty++;else cart.push({...p,qty:1});
 updateCart();
}
function scanBarcode(){
 const inp=document.getElementById('scanInput');const bc=(inp.value||'').trim();
 if(!bc){notify(t('أدخل رقم الباركود','Enter barcode'),'error');return;}
 const p=(appData.products||[]).find(x=>x.barcode===bc);
 if(!p){notify(t('لم يُعثر على منتج','Product not found'),'error');inp.value='';inp.focus();return;}
 addToCart(p.id);inp.value='';inp.focus();notify(t('تمت إضافة: ','Added: ')+p.name);
}
function updateCart(){
 const el=document.getElementById('cartItems');

 const vt=document.getElementById('posVat');

 if(!el)return;
 const total=cart.reduce((a,c)=>a+c.price*c.qty,0);
 const sub=total/1.15;const vat=total-sub;
 if(st)st.textContent=fc(sub);if(vt)vt.textContent=fc(vat);if(tt)tt.textContent=fc(total);
 if(!cart.length){el.innerHTML='<div style="text-align:center;color:#444;padding:40px;font-size:13px">'+t('السلة فارغة','Cart Empty')+'<br><span style="font-size:11px;color:#333">'+t('اضغط على المنتج','Tap a product')+'</span></div>';return;}
 el.innerHTML=cart.map((c,i)=>`<div class="cart-item">

// BARCODE
const C128=['11011001100','11001101100','11001100110','10010011000','10010001100','10001001100','10011001000','10011000100','10001100100','11001001000','11001000100','11000100100','10110011100','10011011100','10011001110','10111001100','10011101100','10011100110','11001110010','11001011100','11001001110','11011100100','11001110100','11101101110','11101001100','11100101100','11100100110','11101100100','11100110100','11100110010','11011011000','11011000110','11000110110','10100011000','10001011000','10001000110','10110001000','10001101000','10001100010','11010001000','11000101000','11000100010','10110111000','10110001110','10001101110','10111011000','10111000110','10001110110','11101110110','11010001110','11000101110','11011101000','11011100010','11011101110','11101011000','11101000110','11100010110','11101101000','11101100010','11100011010','11101111010','11001000010','11110001010','10100110000','10100001100','10010110000','10010000110','10000101100','10000100110','10110010000','10110000100','10011010000','10011000010','10000110100','10000110010','11000010010','11001010000','11110111010','11000010100','10001111010','10100111100','10010111100','10010011110','10111100100','10011110100','10011110010','11110100100','11110010100','11110010010','11011011110','11011110110','11110110110','10101111000','10100011110','10001011110'];
function buildBarPattern(t){let s=104,p='11010010000';for(let i=0;i<t.length;i++){const v=t.charCodeAt(i)-32;if(v<0||v>=C128.length)continue;s+=v*(i+1);p+=C128[v];}p+=C128[s%103]+'1100011101011';return p;}
function drawBarcode(cid,val,w=240,h=50){const c=document.getElementById(cid);if(!c||!val)return;const pat=buildBarPattern(val),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;c.width=(w+2)*dpr;c.height=(h+18)*dpr;c.style.width=(w+2)+'px';c.style.height=(h+18)+'px';ctx.scale(dpr,dpr);ctx.fillStyle='#fff';ctx.fillRect(0,0,w+2,h+18);const bw=w/pat.length;ctx.fillStyle='#000';for(let i=0;i<pat.length;i++){if(pat[i]==='1')ctx.fillRect(1+i*bw,0,Math.ceil(bw),h);}ctx.fillStyle='#000';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(val,(w+2)/2,h+13);}
function genBC(){return"628"+Math.floor(Math.random()*9999999999).toString().padStart(10,'0').substr(0,10);}
function drawAllBarcodes(){(appData.products||[]).forEach(p=>{if(p.barcode)drawBarcode('bc-'+p.id,p.barcode);});}

// SAVE FUNCTIONS
function calcPVat(){const a=parseFloat(document.getElementById('f-amount')?.value)||0;const v=a*0.15;const vf=document.getElementById('f-vat');const tf=document.getElementById('f-total');if(vf)vf.value=v.toFixed(2);if(tf)tf.value=(a+v).toFixed(2);}
function calcDVat(){const a=parseFloat(document.getElementById('f-amount')?.value)||0;const v=a*0.15;const vf=document.getElementById('f-vat');const tf=document.getElementById('f-total');if(vf)vf.value=v.toFixed(2);if(tf)tf.value=(a+v).toFixed(2);}
function refreshMBC(){const v=gv('f-bc');const w=document.getElementById('mbc-wrap');if(w)w.style.display=v?'flex':'none';if(v)setTimeout(()=>drawBarcode('mbc',v,200,43),80);}
function saveEmp(id){const name=gv('f-name'),salary=gn('f-salary');if(!name||!salary){notify(t('يرجى ملء الحقول','Please fill required fields'),'error');return;}const e={id:id||Date.now(),name,role:gv('f-role'),salary,housing:gn('f-housing')};if(id)appData.employees=appData.employees.map(x=>x.id===id?e:x);else appData.employees.push(e);closeModal();scheduleSave();renderMain();notify(id?t('تم التحديث','Updated'):t('تم إضافة الموظف','Employee added'));}
function saveExp(id){const amount=gn('f-amount');if(!amount){notify('أدخل المبلغ','error');return;}const e={id:id||Date.now(),category:gv('f-cat'),amount,month:gv('f-month'),note:gv('f-note')};if(id)appData.expenses=appData.expenses.map(x=>x.id===id?e:x);else appData.expenses.push(e);closeModal();scheduleSave();renderMain();notify(id?t('تم التحديث','Updated'):'تم إضافة المصروف');}
function saveMat(id){const name=gv('f-name'),qty=gn('f-qty'),uc=gn('f-uc');if(!name||!qty||!uc){notify(t('يرجى ملء الحقول','Please fill required fields'),'error');return;}const m={id:id||Date.now(),name,qty,unit:gv('f-unit'),unitCost:uc,month:gv('f-month')};if(id)appData.rawMaterials=appData.rawMaterials.map(x=>x.id===id?m:x);else appData.rawMaterials.push(m);closeModal();scheduleSave();renderMain();notify(id?t('تم التحديث','Updated'):t('تم إضافة المادة','Material added'));}
function saveRev(id){const source=gv('f-source'),amount=gn('f-amount');if(!source||!amount){notify(t('يرجى ملء الحقول','Please fill required fields'),'error');return;}const r={id:id||Date.now(),source,amount,month:gv('f-month')};if(id)appData.revenue=appData.revenue.map(x=>x.id===id?r:x);else appData.revenue.push(r);closeModal();scheduleSave();renderMain();notify(id?t('تم التحديث','Updated'):t('تم إضافة الإيراد','Revenue added'));}
function saveRent(){appData.rent={amount:gn('f-amount'),dueDay:gn('f-dueday')||1,note:gv('f-note')};closeModal();scheduleSave();renderMain();notify(t('تم تحديث الإيجار','Rent updated'));}
function saveProd(id){const name=gv('f-name'),price=gn('f-price');if(!name||!price){notify(t('يرجى ملء الحقول','Please fill required fields'),'error');return;}if(!appData.products)appData.products=[];const p={id:id||Date.now(),name,category:gv('f-cat'),unit:gv('f-unit'),price,cost:gn('f-cost'),barcode:gv('f-bc')};if(id)appData.products=appData.products.map(x=>x.id===id?p:x);else appData.products.push(p);closeModal();scheduleSave();renderMain();notify(id?t('تم التحديث','Updated'):t('تم إضافة المنتج','Product added'));}
function saveSale(id){const amount=gn('f-amount'),date=gv('f-date');if(!amount||!date){notify(t('يرجى ملء الحقول','Please fill required fields'),'error');return;}if(!appData.dailySales)appData.dailySales=[];const s={id:id||Date.now(),date,category:gv('f-cat'),amount,note:gv('f-note')};if(id)appData.dailySales=appData.dailySales.map(x=>x.id===id?s:x);else appData.dailySales.push(s);closeModal();scheduleSave();renderMain();notify(id?t('تم التحديث','Updated'):'تم التسجيل');}
function saveEquip(id){const name=gv('f-name'),cost=gn('f-cost');if(!name||!cost){notify(t('يرجى ملء الحقول','Please fill required fields'),'error');return;}if(!appData.equipment)appData.equipment=[];const e={id:id||Date.now(),name,type:gv('f-type'),condition:gv('f-cond'),purchaseCost:cost,maintenanceCost:gn('f-maint'),purchaseDate:gv('f-date'),note:gv('f-note')};if(id)appData.equipment=appData.equipment.map(x=>x.id===id?e:x);else appData.equipment.push(e);closeModal();scheduleSave();renderMain();notify(id?t('تم التحديث','Updated'):t('تم إضافة المعدة','Equipment added'));}
function savePurchase(){const amount=gn('f-amount'),date=gv('f-date');if(!amount||!date){notify(t('يرجى ملء الحقول','Please fill required fields'),'error');return;}if(!appData.purchases)appData.purchases=[];const vat=amount*0.15;appData.purchases.push({id:Date.now(),date,category:gv('f-cat'),supplier:gv('f-supplier'),amount,vat,total:amount+vat,payMethod:gv('f-pay'),note:gv('f-note')});closeModal();scheduleSave();renderMain();notify(t('تم حفظ الفاتورة','Invoice saved'));}
function saveDelivery(){const amount=gn('f-amount'),date=gv('f-date');if(!amount||!date){notify(t('يرجى ملء الحقول','Please fill required fields'),'error');return;}if(!appData.deliveryOrders)appData.deliveryOrders=[];const vat=amount*0.15;appData.deliveryOrders.push({id:Date.now(),date,platform:gv('f-platform'),orderNum:gv('f-ordernum'),customerName:gv('f-customer'),items:gv('f-items'),amount,vat,total:amount+vat,status:gv('f-status')||'new'});closeModal();scheduleSave();renderMain();notify(t('تم حفظ الطلب','Order saved'));}
async function saveUser(){const name=gv('f-name'),username=gv('f-uname'),password=gv('f-pw');if(!name||!username||!password){notify(t('يرجى ملء الحقول','Please fill required fields'),'error');return;}const r=await apiFetch('/api/users',{method:'POST',body:JSON.stringify({name,username,password,role:gv('f-role')})});if(r?.ok){closeModal();notify(t('تم إضافة المستخدم','User added'));}else notify(r?.error||'خطأ','error');}

// DELETE
function del(type,id){
 if(!confirm(t('هل تريد الحذف؟','Are you sure you want to delete?')))return;
 const map={employee:'employees',expense:'expenses',material:'rawMaterials',revenue:'revenue',product:'products',sale:'dailySales',equipment:'equipment',purchase:'purchases',deliveryOrder:'deliveryOrders'};
 const key=map[type];if(!key||!appData[key])return;
 appData[key]=appData[key].filter(x=>x.id!==id);
 scheduleSave();renderMain();notify(t('تم الحذف','Deleted'));
}

// EXPORT EXCEL
function exportExcel(){
 const s=calcStats();const cm=appData.currentMonth;
 const wb=XLSX.utils.book_new();
 const add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name);
 add(t("الملخص","Summary"),[["CRMB Bakery"],[t("التقرير: ","Report: ")+ml(cm)],[],[t("البند","Item"),t("المبلغ","Amount")],["إجمالي الإيرادات",s.totalRev],["رواتب وسكن",s.totalSalaries],["مواد خام",s.totalRaw],["إيجار",appData.rent.amount],["مصاريف",s.totalExp],["إجمالي التكاليف",s.totalCosts],[],[s.netProfit>=0?t("صافي الربح","Net Profit"):t("صافي الخسارة","Net Loss"),Math.abs(s.netProfit)],[t("هامش الربح %","Profit Margin %"),s.margin+"%"]]);
 add(t("الإيرادات","Revenue"),[[t("المصدر","Source"),t("الشهر","Month"),t("المبلغ","Amount")],...appData.revenue.map(r=>[r.source,ml(r.month),r.amount])]);
 add(t("الموظفون","Employees"),[[t("الاسم","Name"),t("المنصب","Position"),t("الراتب","Salary"),t("السكن","Housing"),t("الإجمالي","Total")],...appData.employees.map(e=>[e.name,e.role,e.salary,e.housing,e.salary+e.housing])]);
 add(t("المواد الخام","Raw Materials"),[[t("المادة","Material"),t("الكمية","Qty"),t("الوحدة","Unit"),t("سعر الوحدة","Unit Price"),t("الإجمالي","Total"),t("الشهر","Month")],...appData.rawMaterials.map(r=>[r.name,r.qty,r.unit,r.unitCost,r.qty*r.unitCost,ml(r.month)])]);
 add(t("المصاريف","Expenses"),[[t("التصنيف","Category"),t("المبلغ","Amount"),t("الشهر","Month"),t("ملاحظة","Note")],...appData.expenses.map(e=>[e.category,e.amount,ml(e.month),e.note||""])]);
 add(t("المشتريات","Purchases"),[[t("التاريخ","Date"),t("المورد","Supplier"),t("الفئة","Category"),t("قبل الضريبة","Excl. VAT"),t("الضريبة","VAT"),t("الإجمالي","Total")],...(appData.purchases||[]).map(p=>[p.date,p.supplier||"",p.category||"",p.amount,p.vat||0,p.total])]);
 add(t("المبيعات اليومية","Daily Sales"),[[t("التاريخ","Date"),t("الفئة","Category"),t("المبلغ","Amount"),t("ملاحظة","Note")],...(appData.dailySales||[]).map(s=>[s.date,s.category||"",s.amount,s.note||""])]);
 XLSX.writeFile(wb,`CRMB_${ml(cm).replace(' ','_')}.xlsx`);
 notify(t('تم تصدير Excel!','Excel exported!'));
}

// NOTIFY
function notify(msg,type='success'){
 const n=document.getElementById('notif');
 n.textContent=msg;n.style.background=type==='error'?'var(--red)':'var(--green)'; n.style.color='#fff';
 n.style.display='block';setTimeout(()=>n.style.display='none',3000);
}

// AUTO REFRESH
function startAutoRefresh(){
 setInterval(async()=>{
 const old=JSON.stringify(appData);
 if(await loadData()&&JSON.stringify(appData)!==old){
 if(currentTab==='barcode'){renderMain();setTimeout(drawAllBarcodes,80);}
 else renderMain();
 }
 },15000);
 setInterval(()=>{if(currentTab==='users')loadUsersList();},3000);
}

// MONTH SELECT
function initMonthSelect(){
 const sel=document.getElementById('monthSelect');
 if(sel&&appData)sel.innerHTML=MONTHS.map(m=>`<option value="${m}" ${m===appData.currentMonth?'selected':''}>${ml(m)}</option>`).join('');
}

init();
</script>
