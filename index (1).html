<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CRMB — نظام محاسبة المخابز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0d;--bg2:#111;--bg3:#1a1a1a;--border:#2a2a2a;--gold:#D4A843;--white:#e0e0e0;--green:#27ae60;--red:#e74c3c;--blue:#3498db;--purple:#9b59b6;--orange:#e67e22}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--white);min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
button{cursor:pointer;font-family:'Cairo',sans-serif}
input,select,textarea{font-family:'Cairo',sans-serif;outline:none}
input:focus,select:focus{border-color:var(--gold)!important}
#header{background:#111;border-bottom:1px solid #222;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.logo-title{color:var(--gold);font-weight:700;font-size:16px}
.logo-sub{color:#666;font-size:10px}
.hcontrols{display:flex;align-items:center;gap:8px}
.sync-badge{background:#1a2a1a;border:1px solid #27ae6040;border-radius:8px;padding:4px 10px;color:#27ae60;font-size:11px}
.sync-badge.syncing{background:#1a1a2a;color:#3498db}
.sync-badge.offline{background:#2a1a1a;color:#e74c3c}
#layout{display:flex;min-height:calc(100vh - 60px)}
#sidebar{width:200px;background:#111;border-left:1px solid #1e1e1e;padding:8px 0;flex-shrink:0;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.nav-section{padding:6px 12px;color:#444;font-size:10px;font-weight:700;letter-spacing:1px;margin-top:6px}
.nav-btn{width:100%;background:transparent;border:none;border-right:3px solid transparent;color:#666;padding:11px 16px;text-align:right;font-size:13px;display:flex;align-items:center;gap:8px;transition:all .2s}
.nav-btn:hover{color:#aaa;background:rgba(255,255,255,.03)}
.nav-btn.active{background:linear-gradient(90deg,#2a1800,#1a1200);border-right-color:var(--gold);color:var(--gold);font-weight:700}
.nav-divider{border-bottom:1px solid #1e1e1e;margin:6px 0}
#main{flex:1;padding:20px;overflow-y:auto;min-width:0}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:rgba(255,255,255,.04);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.kpi-icon{position:absolute;top:-8px;right:-6px;font-size:52px;opacity:.07}
.kpi-label{color:#aaa;font-size:12px;margin-bottom:5px}
.kpi-value{font-size:20px;font-weight:700;font-family:monospace}
.kpi-sub{color:#666;font-size:11px;margin-top:3px}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead tr{background:#1a1a1a}
thead th{padding:10px 13px;color:var(--gold);font-size:12px;font-weight:600;text-align:right;white-space:nowrap}
tbody tr{border-bottom:1px solid #1e1e1e;transition:background .15s}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tbody td{padding:10px 13px;font-size:13px;color:#ddd;vertical-align:middle}
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.sec-title{color:var(--gold);font-size:19px;font-weight:700}
.btn{border:none;border-radius:10px;color:#fff;padding:8px 16px;font-weight:600;font-size:13px;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-gold{background:var(--gold);color:#000}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-blue{background:var(--blue)}
.btn-purple{background:var(--purple)}
.btn-orange{background:var(--orange)}
.btn-dark{background:#333}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:8px}
.prog-bar{background:#222;border-radius:4px;height:8px;overflow:hidden}
.prog-fill{border-radius:4px;height:8px;transition:width 1s}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#141414;border-radius:18px;padding:26px;width:100%;max-width:460px;border:1px solid #2a2a2a;max-height:92vh;overflow-y:auto}
.modal-title{color:var(--gold);margin-bottom:18px;font-size:17px;font-weight:700}
.form-field{margin-bottom:13px}
.form-label{color:#aaa;font-size:12px;margin-bottom:5px;display:block;font-weight:500}
.form-input{background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;padding:9px 12px;width:100%;font-size:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint-gold{background:#1a1500;color:var(--gold);border:1px solid #D4A84330;padding:11px 13px;border-radius:9px;margin-bottom:13px;font-size:13px}
#notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 22px;border-radius:12px;z-index:9999;font-size:14px;font-weight:600;display:none}
.pnl-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1a1a1a;font-size:13px}
.pnl-total{display:flex;justify-content:space-between;padding:10px 0;border-top:2px solid #333;font-weight:700;font-size:14px}
/* POS */
.pos-layout{display:grid;grid-template-columns:1fr 340px;gap:16px}
.pos-cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;flex-shrink:0}
.pos-cat-btn{background:#1a1a1a;border:1px solid #333;border-radius:20px;color:#aaa;padding:8px 18px;font-size:13px;white-space:nowrap;cursor:pointer;transition:all .2s;font-family:'Cairo',sans-serif}
.pos-cat-btn.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.pos-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow-y:auto;max-height:calc(100vh - 280px)}
.pos-tile{background:#1a1a1a;border:2px solid #2a2a2a;border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;transition:all .15s;min-height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.pos-tile:hover{border-color:var(--gold);background:#1a1500}
.pos-tile:active{transform:scale(.94)}
.pos-tile-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:5px;line-height:1.3}
.pos-tile-cat{font-size:11px;color:#666;margin-bottom:6px}
.pos-tile-price{font-size:17px;font-weight:900;color:var(--green)}
.cart-list{flex:1;overflow-y:auto;background:#111;border-radius:12px;border:1px solid #222;min-height:200px;max-height:calc(100vh - 420px)}
.cart-item{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #1a1a1a}
.qty-btn{background:#2a2a2a;border:none;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.qty-btn:active{background:var(--gold);color:#000}
/* Products */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.product-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.product-card-head{background:#1a1500;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.product-card-body{padding:12px;background:#fff;display:flex;justify-content:center}
.product-card-stats{padding:10px 15px;display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid #1a1a1a}
.stat-item{text-align:center}
.stat-label{color:#888;font-size:10px;margin-bottom:2px}
.stat-value{font-weight:700;font-size:13px}
.product-card-actions{padding:10px 13px;display:flex;gap:7px}
/* Delivery */
.del-tab{padding:8px 18px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#aaa;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px}
.del-tab.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.order-card{background:#1a1a1a;border-radius:12px;padding:14px 16px;border:1px solid #2a2a2a;margin-bottom:10px}
.user-card{background:#1a1a1a;border-radius:12px;padding:14px 16px;border:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:90px;padding:0 4px}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-val{font-size:9px;color:#888;text-align:center}
.bar-fill{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .8s}
.bar-lbl{font-size:9px;color:#888;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50px}
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:#111;border-top:1px solid #222;grid-template-columns:repeat(4,1fr);height:58px}
.bnav-btn{background:transparent;border:none;color:#555;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;padding:4px 0;transition:color .2s}
.bnav-btn.active{color:var(--gold)}
.bnav-btn span:first-child{font-size:20px}
#more-nav{background:#1a1a1a;border-radius:14px 14px 0 0;position:fixed;bottom:58px;left:0;right:0;padding:16px;display:none;grid-template-columns:repeat(4,1fr);gap:10px;border:1px solid #333;border-bottom:none;z-index:199}
.bnav-more-btn{background:#222;border:none;border-radius:10px;color:#aaa;padding:12px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
@media(max-width:768px){
  #sidebar{display:none}#main{padding:14px;padding-bottom:72px}
  #bottom-nav{display:grid}.kpi-grid{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}.pos-layout{grid-template-columns:1fr}
  .pos-products{grid-template-columns:repeat(3,1fr);max-height:none}
}
</style>
</head>
<body>
<div id="notif"></div>
<div id="header">
  <div>
    <div class="logo-title">CRMB Bakery</div>
    <div class="logo-sub">نظام محاسبة المخابز</div>
  </div>
  <div class="hcontrols">
    <div class="sync-badge syncing" id="syncBadge">🔄 جاري المزامنة</div>
    <button onclick="toggleLang()" id="langBtn" style="background:#1a1a2a;border:1px solid #3498db40;border-radius:8px;padding:4px 12px;color:#3498db;font-size:12px;cursor:pointer;font-family:Cairo,sans-serif">EN</button>
    <div style="background:#1a1a00;border:1px solid #D4A84330;border-radius:8px;padding:4px 10px;color:#D4A843;font-size:11px;cursor:pointer" onclick="showTab('profile')" id="userBadge">👤</div>
    <button class="btn btn-green" onclick="exportExcel()" style="padding:6px 12px;font-size:12px">📥 Excel</button>
    <select id="monthSelect" style="background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;padding:6px 10px;font-size:12px;font-family:Cairo,sans-serif" onchange="changeMonth(this.value)"></select>
  </div>
</div>
<div id="layout">
  <div id="sidebar">
    <div class="nav-section">الرئيسية</div>
    <button class="nav-btn active" onclick="showTab('dashboard')" id="nav-dashboard"><span>📊</span><span>لوحة التحكم</span></button>
    <button class="nav-btn" onclick="showTab('pos')" id="nav-pos"><span>🖥️</span><span>نقطة البيع</span></button>
    <button class="nav-btn" onclick="showTab('products')" id="nav-products"><span>📦</span><span>المنتجات</span></button>
    <button class="nav-btn" onclick="showTab('purchases')" id="nav-purchases"><span>🛍️</span><span>المشتريات</span></button>
    <button class="nav-btn" onclick="showTab('delivery')" id="nav-delivery"><span>🚴</span><span>طلبات التوصيل</span></button>
    <button class="nav-btn" onclick="showTab('sales')" id="nav-sales"><span>🛒</span><span>المبيعات اليومية</span></button>
    <button class="nav-btn" onclick="showTab('reports')" id="nav-reports"><span>📈</span><span>التقارير</span></button>
    <div class="nav-divider"></div>
    <div class="nav-section">الإدارة</div>
    <button class="nav-btn" onclick="showTab('employees')" id="nav-employees"><span>👥</span><span>الموظفون</span></button>
    <button class="nav-btn" onclick="showTab('revenue')" id="nav-revenue"><span>💰</span><span>الإيرادات</span></button>
    <button class="nav-btn" onclick="showTab('expenses')" id="nav-expenses"><span>📋</span><span>المصاريف</span></button>
    <button class="nav-btn" onclick="showTab('materials')" id="nav-materials"><span>🌾</span><span>المواد الخام</span></button>
    <button class="nav-btn" onclick="showTab('equipment')" id="nav-equipment"><span>⚙️</span><span>المعدات</span></button>
    <button class="nav-btn" onclick="showTab('rent')" id="nav-rent"><span>🏠</span><span>الإيجار</span></button>
    <button class="nav-btn" onclick="showTab('barcode')" id="nav-barcode"><span>🏷️</span><span>الباركود</span></button>
    <div class="nav-divider"></div>
    <div class="nav-section">النظام</div>
    <button class="nav-btn" onclick="showTab('users')" id="nav-users"><span>🔑</span><span>المستخدمون</span></button>
    <button class="nav-btn" onclick="showTab('profile')" id="nav-profile"><span>👤</span><span>حسابي</span></button>
    <button class="nav-btn" style="color:#e74c3c" onclick="doLogout()"><span>🚪</span><span>خروج</span></button>
  </div>
  <div id="main">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;gap:16px;text-align:center">
      <div style="font-size:44px">⏳</div>
      <div style="color:var(--gold);font-size:18px;font-weight:700">جاري التحميل...</div>
      <div style="color:#555;font-size:13px" id="loadMsg">يرجى الانتظار</div>
    </div>
  </div>
</div>
<div id="bottom-nav">
  <button class="bnav-btn active" onclick="showTab('dashboard')" id="bnav-dashboard"><span>📊</span>الرئيسية</button>
  <button class="bnav-btn" onclick="showTab('pos')" id="bnav-pos"><span>🖥️</span>البيع</button>
  <button class="bnav-btn" onclick="showTab('delivery')" id="bnav-delivery"><span>🚴</span>التوصيل</button>
  <button class="bnav-btn" onclick="toggleMore()" id="bnav-more-btn"><span>☰</span>المزيد</button>
</div>
<div id="more-nav">
  <button class="bnav-more-btn" onclick="showTab('products');toggleMore()"><span>📦</span><span>المنتجات</span></button>
  <button class="bnav-more-btn" onclick="showTab('purchases');toggleMore()"><span>🛍️</span><span>المشتريات</span></button>
  <button class="bnav-more-btn" onclick="showTab('sales');toggleMore()"><span>🛒</span>المبيعات</button>
  <button class="bnav-more-btn" onclick="showTab('reports');toggleMore()"><span>📈</span><span>التقارير</span></button>
  <button class="bnav-more-btn" onclick="showTab('employees');toggleMore()"><span>👥</span><span>الموظفون</span></button>
  <button class="bnav-more-btn" onclick="showTab('expenses');toggleMore()"><span>📋</span><span>المصاريف</span></button>
  <button class="bnav-more-btn" onclick="showTab('profile');toggleMore()"><span>👤</span><span>حسابي</span></button>
  <button class="bnav-more-btn" style="color:#e74c3c" onclick="doLogout()"><span>🚪</span><span>خروج</span></button>
</div>
<div id="modal-container"></div>
<script>

// ===== LANGUAGE =====
let lang = 'ar';
try{ lang = localStorage.getItem('crmb_lang')||'ar'; }catch(e){}

const TR = {
  ar:{
    dashboard:'لوحة التحكم', pos:'نقطة البيع', products:'المنتجات',
    purchases:'المشتريات', delivery:'طلبات التوصيل', sales:'المبيعات',
    reports:'التقارير', employees:'الموظفون', revenue:'الإيرادات',
    expenses:'المصاريف', materials:'المواد الخام', equipment:'المعدات',
    rent:'الإيجار', barcode:'الباركود', users:'المستخدمون',
    profile:'حسابي', logout:'خروج',
    main_section:'الرئيسية', mgmt_section:'الإدارة', sys_section:'النظام',
    subtitle:'نظام محاسبة المخابز',
    loading:tr('loading'), please_wait:tr('please_wait'), attempt:'محاولة',
  },
  en:{
    dashboard:'Dashboard', pos:'Point of Sale', products:'Products',
    purchases:'Purchases', delivery:'Delivery Orders', sales:'Daily Sales',
    reports:'Reports', employees:'Employees', revenue:'Revenue',
    expenses:'Expenses', materials:'Raw Materials', equipment:'Equipment',
    rent:'Rent', barcode:'Barcode', users:'Users',
    profile:'My Account', logout:'Logout',
    main_section:'MAIN', mgmt_section:'MANAGEMENT', sys_section:'SYSTEM',
    subtitle:'Bakery Management System',
    loading:'Loading...', please_wait:'Please wait', attempt:'Attempt',
  }
};
const tr = k => (TR[lang]||TR.ar)[k]||k;

function toggleLang(){
  lang = lang==='ar'?'en':'ar';
  try{localStorage.setItem('crmb_lang',lang);}catch(e){}
  window.location.reload();
}

function applyLang(){
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  document.documentElement.lang = lang;
  const btn=document.getElementById('langBtn');
  if(btn) btn.textContent = lang==='ar'?'EN':'عر';
  const sub=document.querySelector('.logo-sub');
  if(sub) sub.textContent=tr('subtitle');
  // Nav labels
  const navMap={
    'nav-dashboard':'dashboard','nav-pos':'pos','nav-products':'products',
    'nav-purchases':'purchases','nav-delivery':'delivery','nav-sales':'sales',
    'nav-reports':'reports','nav-employees':'employees','nav-revenue':'revenue',
    'nav-expenses':'expenses','nav-materials':'materials','nav-equipment':'equipment',
    'nav-rent':'rent','nav-barcode':'barcode','nav-users':'users','nav-profile':'profile',
  };
  Object.entries(navMap).forEach(([id,key])=>{
    const el=document.getElementById(id);
    if(el){ const spans=el.querySelectorAll('span'); if(spans[1]) spans[1].textContent=tr(key); else if(el.childNodes[1]) el.childNodes[1].textContent=tr(key); }
  });
  const ls=document.getElementById('nav-sections');
  // Update section labels
  document.querySelectorAll('.nav-section').forEach((el,i)=>{
    const keys=['main_section','mgmt_section','sys_section'];
    if(keys[i]) el.textContent=tr(keys[i]);
  });
  // Logout button
  const lo=document.querySelector('[onclick="doLogout()"] span:last-child');
  if(lo) lo.textContent=tr('logout');
}

// STATE
let appData=null,currentUser=null,currentTab='dashboard',moreOpen=false,saveTimer=null,syncStatus='syncing';
let posSelectedCat='الكل',cart=[],paymentMethod='cash',deliveryPlatform='الكل';

const MONTHS=["2025-01","2025-02","2025-03","2025-04","2025-05","2025-06","2025-07","2025-08","2025-09","2025-10","2025-11","2025-12","2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09","2026-10","2026-11","2026-12","2027-01","2027-02","2027-03","2027-04","2027-05","2027-06"];
const MN=["","يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const ml=m=>{const[y,mo]=m.split('-');return`${MN[+mo]} ${y}`;};
const fc=n=>new Intl.NumberFormat('ar-SA',{style:'currency',currency:'SAR',minimumFractionDigits:2}).format(n||0);
const VAT=0.15;

// API
async function apiFetch(url,opts={}){
  try{
    const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});
    if(r.status===401) return {_401:true};
    return r.json();
  }catch(e){return null;}
}
async function loadData(){
  const d=await apiFetch('/api/data');
  if(d&&!d._401){appData=d;setSyncBadge('online');return true;}
  setSyncBadge('offline');return false;
}
async function saveData(){
  setSyncBadge('syncing');
  const r=await apiFetch('/api/data',{method:'POST',body:JSON.stringify(appData)});
  setSyncBadge(r?.ok?'online':'offline');
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveData,800);}

function setSyncBadge(s){
  syncStatus=s;
  const b=document.getElementById('syncBadge');if(!b)return;
  const m={online:'🟢 متزامن',syncing:'🔄 جاري الحفظ',offline:'🔴 غير متصل'};
  b.textContent=m[s]||m.syncing;
  b.className='sync-badge'+(s==='syncing'?' syncing':s==='offline'?' offline':'');
}

function setLoadMsg(m){const e=document.getElementById('loadMsg');if(e)e.textContent=m;}

// INIT
async function init(){
  applyLang();
  let attempt=0;
  const tryConnect=async()=>{
    attempt++;
    setLoadMsg(tr('attempt')+' '+attempt+'...');
    const me=await apiFetch('/api/me');
    if(me===null){setTimeout(tryConnect,4000);return;}
    if(me._401){window.location.href='/login';return;}
    currentUser=me;
    document.getElementById('userBadge').textContent='👤 '+currentUser.name;
    const ok=await loadData();
    if(!ok){setTimeout(tryConnect,4000);return;}
    const sel=document.getElementById('monthSelect');
    sel.innerHTML=MONTHS.map(m=>`<option value="${m}" ${m===appData.currentMonth?'selected':''}>${ml(m)}</option>`).join('');
    renderMain();
    setInterval(async()=>{const old=JSON.stringify(appData);if(await loadData()&&JSON.stringify(appData)!==old)renderMain();},15000);
    setInterval(()=>{if(currentTab==='users')loadUsersList();},3000);
  };
  tryConnect();
}

const kpi=(l,v,icon,c,sub='')=>`<div class="kpi-card" style="border-color:${c}30"><div class="kpi-icon">${icon}</div><div class="kpi-label">${l}</div><div class="kpi-value" style="color:${c}">${v}</div>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`;
const gv=id=>(document.getElementById(id)||{}).value||'';
const gn=id=>parseFloat((document.getElementById(id)||{}).value)||0;

function calcStats(){
  const cm=appData.currentMonth;
  const totalSalaries=appData.employees.reduce((s,e)=>s+e.salary+e.housing,0);
  const totalRaw=appData.rawMaterials.filter(r=>r.month===cm).reduce((s,r)=>s+r.qty*r.unitCost,0);
  const totalExp=appData.expenses.filter(e=>e.month===cm).reduce((s,e)=>s+e.amount,0);
  const totalRev=appData.revenue.filter(r=>r.month===cm).reduce((s,r)=>s+r.amount,0);
  const totalCosts=totalSalaries+totalRaw+totalExp+appData.rent.amount;
  const netProfit=totalRev-totalCosts;
  const margin=totalRev>0?((netProfit/totalRev)*100).toFixed(1):0;
  return{totalSalaries,totalRaw,totalExp,totalRev,totalCosts,netProfit,margin,cm};
}

function renderMain(){
  const main=document.getElementById('main');
  if(!main||!appData)return;
  const s=calcStats();
  const renders={
    dashboard:()=>renderDashboard(s),pos:()=>renderPOS(),
    products:()=>renderProducts(),purchases:()=>renderPurchases(),
    delivery:()=>renderDelivery(),sales:()=>renderSales(),
    revenue:()=>renderRevenue(s),materials:()=>renderMaterials(s),
    employees:()=>renderEmployees(s),expenses:()=>renderExpenses(s),
    equipment:()=>renderEquipment(),rent:()=>renderRent(s),
    reports:()=>renderReports(s),barcode:()=>renderBarcode(),
    users:()=>renderUsers(),profile:()=>renderProfile(),
  };
  try{main.innerHTML=(renders[currentTab]||renders.dashboard)();}
  catch(e){main.innerHTML=`<div style="padding:40px;color:var(--red);text-align:center"><div style="font-size:32px;margin-bottom:12px">⚠️</div><div style="font-weight:700;margin-bottom:8px">خطأ في التطبيق</div><div style="color:#888;font-size:13px">${e.message}</div></div>`;console.error(e);}

}

function filterPOSTiles(q){
  const g=document.getElementById('posGrid');if(!g)return;
  const prods=(appData.products||[]).filter(p=>posSelectedCat==='الكل'||p.category===posSelectedCat);
  const f=q?prods.filter(p=>p.name.includes(q)||(p.barcode||'').includes(q)):prods;
  if(!f.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#444;padding:30px">لا توجد نتائج</div>';return;}

function addToCart(id){
  const p=(appData.products||[]).find(x=>x.id===id);if(!p)return;
  const e=cart.find(c=>c.id===id);if(e)e.qty++;else cart.push({...p,qty:1});
  updateCart();
}
function scanBarcode(){
  const inp=document.getElementById('scanInput');const bc=(inp.value||'').trim();
  if(!bc){notify('أدخل رقم الباركود','error');return;}
  const p=(appData.products||[]).find(x=>x.barcode===bc);
  if(!p){notify('لم يُعثر على منتج','error');inp.value='';inp.focus();return;}
  addToCart(p.id);inp.value='';inp.focus();notify('تمت إضافة: '+p.name);
}
function updateCart(){
  const el=document.getElementById('cartItems');
  const st=document.getElementById('posSubtotal');
  const vt=document.getElementById('posVat');

  if(!el)return;
  const total=cart.reduce((a,c)=>a+c.price*c.qty,0);
  const sub=total/1.15;const vat=total-sub;
  if(st)st.textContent=fc(sub);if(vt)vt.textContent=fc(vat);if(tt)tt.textContent=fc(total);
  if(!cart.length){el.innerHTML='<div style="text-align:center;color:#444;padding:40px;font-size:13px">السلة فارغة<br><span style="font-size:11px;color:#333">اضغط على المنتج</span></div>';return;}

  </div>`).join('');

function chgQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCart();}

function clearCart(){cart=[];updateCart();const i=document.getElementById('scanInput');if(i){i.value='';i.focus();}}
function setPayment(m){

async function completeSale(){
  if(!cart.length){notify('السلة فارغة!','error');return;}
  const total=cart.reduce((a,c)=>a+c.price*c.qty,0);
  const sub=total/1.15;const vat=total-sub;
  const today=new Date().toISOString().split('T')[0];
  const note=cart.map(c=>`${c.name}×${c.qty}`).join('، ');
  if(!appData.dailySales)appData.dailySales=[];
  appData.dailySales.push({id:Date.now(),date:today,category:'نقطة البيع',amount:total,subtotal:sub,vat,note,payMethod:paymentMethod,items:cart.map(c=>({id:c.id,name:c.name,qty:c.qty,price:c.price}))});
  await saveData();notify('تم البيع! '+fc(total));cart=[];renderMain();
  setTimeout(()=>{const i=document.getElementById('scanInput');if(i)i.focus();},100);

function renderSales(){

const C128=['11011001100','11001101100','11001100110','10010011000','10010001100','10001001100','10011001000','10011000100','10001100100','11001001000','11001000100','11000100100','10110011100','10011011100','10011001110','10111001100','10011101100','10011100110','11001110010','11001011100','11001001110','11011100100','11001110100','11101101110','11101001100','11100101100','11100100110','11101100100','11100110100','11100110010','11011011000','11011000110','11000110110','10100011000','10001011000','10001000110','10110001000','10001101000','10001100010','11010001000','11000101000','11000100010','10110111000','10110001110','10001101110','10111011000','10111000110','10001110110','11101110110','11010001110','11000101110','11011101000','11011100010','11011101110','11101011000','11101000110','11100010110','11101101000','11101100010','11100011010','11101111010','11001000010','11110001010','10100110000','10100001100','10010110000','10010000110','10000101100','10000100110','10110010000','10110000100','10011010000','10011000010','10000110100','10000110010','11000010010','11001010000','11110111010','11000010100','10001111010','10100111100','10010111100','10010011110','10111100100','10011110100','10011110010','11110100100','11110010100','11110010010','11011011110','11011110110','11110110110','10101111000','10100011110','10001011110'];
function buildBarPattern(t){let s=104,p='11010010000';for(let i=0;i<t.length;i++){const v=t.charCodeAt(i)-32;if(v<0||v>=C128.length)continue;s+=v*(i+1);p+=C128[v];}p+=C128[s%103]+'1100011101011';return p;}
function drawBarcode(cid,val,w=240,h=50){const c=document.getElementById(cid);if(!c||!val)return;const pat=buildBarPattern(val),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;c.width=(w+2)*dpr;c.height=(h+18)*dpr;c.style.width=(w+2)+'px';c.style.height=(h+18)+'px';ctx.scale(dpr,dpr);ctx.fillStyle='#fff';ctx.fillRect(0,0,w+2,h+18);const bw=w/pat.length;ctx.fillStyle='#000';for(let i=0;i<pat.length;i++){if(pat[i]==='1')ctx.fillRect(1+i*bw,0,Math.ceil(bw),h);}ctx.fillStyle='#000';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(val,(w+2)/2,h+13);}
function genBC(){return"628"+Math.floor(Math.random()*9999999999).toString().padStart(10,'0').substr(0,10);}
function drawAllBarcodes(){(appData.products||[]).forEach(p=>{if(p.barcode)drawBarcode('bc-'+p.id,p.barcode);});}

async function changePassword(){
  const op=gv('oldpw'),np=gv('newpw'),cp=gv('conpw');
  if(np!==cp){showPwMsg('كلمات المرور لا تتطابق','var(--red)');return;}
  if(np.length<6){showPwMsg('كلمة المرور قصيرة جداً','var(--red)');return;}
  const r=await apiFetch('/api/change-password',{method:'POST',body:JSON.stringify({oldPassword:op,newPassword:np})});
  showPwMsg(r?.ok?'تم تغيير كلمة المرور':r?.error||'خطأ',r?.ok?'var(--green)':'var(--red)');
}

  if(type==='equipment')return`<div class="modal-title">${isEdit?'تعديل':'إضافة'} معدة</div><div class="form-field"><label class="form-label">الاسم *</label><input class="form-input" id="f-name" value="${item?.name||''}"></div><div class="form-row"><div class="form-field"><label class="form-label">النوع</label><select class="form-input" id="f-type">${["معدات خبز","معدات تبريد","معدات تسخين","أدوات","أجهزة كهربائية","أثاث","أخرى"].map(t=>`<option ${item?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-field"><label class="form-label">الحالة</label><select class="form-input" id="f-cond">${["ممتاز","جيد","متوسط","يحتاج_صيانة"].map(c=>`<option ${item?.condition===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="form-row"><div class="form-field"><label class="form-label">سعر الشراء *</label><input class="form-input" id="f-cost" type="number" value="${item?.purchaseCost||''}"></div><div class="form-field"><label class="form-label">الصيانة</label><input class="form-input" id="f-maint" type="number" value="${item?.maintenanceCost||''}"></div></div><div class="form-field"><label class="form-label">تاريخ الشراء</label><input class="form-input" id="f-date" type="date" value="${item?.purchaseDate||''}"></div><div class="form-field"><label class="form-label">ملاحظة</label><input class="form-input" id="f-note" value="${item?.note||''}"></div><div style="display:flex;gap:10px"><button class="btn btn-blue" style="flex:1" onclick="saveEquip(${id||'null'})">حفظ</button><button class="btn btn-dark" style="flex:1" onclick="closeModal()">إلغاء</button></div>`;
  if(type==='purchase')return`<div class="modal-title">فاتورة مشتريات</div><div class="form-row"><div class="form-field"><label class="form-label">التاريخ *</label><input class="form-input" id="f-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div><div class="form-field"><label class="form-label">الفئة</label><select class="form-input" id="f-cat">${["مواد خام","معدات","خدمات","مستلزمات","أخرى"].map(c=>`<option>${c}</option>`).join('')}</select></div></div><div class="form-field"><label class="form-label">المورد</label><input class="form-input" id="f-supplier" placeholder="اسم المورد..."></div><div class="form-field"><label class="form-label">المبلغ قبل الضريبة *</label><input class="form-input" id="f-amount" type="number" step="0.01" oninput="calcPVat()"></div><div class="form-row"><div class="form-field"><label class="form-label">ضريبة 15%</label><input class="form-input" id="f-vat" type="number" readonly style="background:#111;color:var(--orange)"></div><div class="form-field"><label class="form-label">الإجمالي</label><input class="form-input" id="f-total" type="number" readonly style="background:#111;color:var(--green);font-weight:700"></div></div><div class="form-field"><label class="form-label">الدفع</label><select class="form-input" id="f-pay"><option value="cash">نقدي</option><option value="mada">مدى</option><option value="transfer">تحويل</option><option value="credit">آجل</option></select></div><div class="form-field"><label class="form-label">ملاحظة</label><input class="form-input" id="f-note"></div><div style="display:flex;gap:10px"><button class="btn btn-blue" style="flex:1" onclick="savePurchase()">حفظ</button><button class="btn btn-dark" style="flex:1" onclick="closeModal()">إلغاء</button></div>`;
  if(type==='deliveryOrder')return`<div class="modal-title">طلب توصيل جديد</div><div class="form-row"><div class="form-field"><label class="form-label">المنصة *</label><select class="form-input" id="f-platform">${["كيتا","جاهز","هنقرستيشن","أخرى"].map(p=>`<option>${p}</option>`).join('')}</select></div><div class="form-field"><label class="form-label">التاريخ *</label><input class="form-input" id="f-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div></div><div class="form-row"><div class="form-field"><label class="form-label">رقم الطلب</label><input class="form-input" id="f-ordernum"></div><div class="form-field"><label class="form-label">اسم العميل</label><input class="form-input" id="f-customer"></div></div><div class="form-field"><label class="form-label">الأصناف</label><input class="form-input" id="f-items" placeholder="خبز × 2..."></div><div class="form-field"><label class="form-label">المبلغ قبل الضريبة *</label><input class="form-input" id="f-amount" type="number" step="0.01" oninput="calcDVat()"></div><div class="form-row"><div class="form-field"><label class="form-label">ضريبة 15%</label><input class="form-input" id="f-vat" type="number" readonly style="background:#111;color:var(--orange)"></div><div class="form-field"><label class="form-label">الإجمالي</label><input class="form-input" id="f-total" type="number" readonly style="background:#111;color:var(--green);font-weight:700"></div></div><div class="form-field"><label class="form-label">الحالة</label><select class="form-input" id="f-status"><option value="new">جديد</option><option value="preparing">قيد التحضير</option><option value="ready">جاهز</option><option value="delivered">تم التسليم</option></select></div><div style="display:flex;gap:10px"><button class="btn btn-gold" style="flex:1" onclick="saveDelivery()">حفظ</button><button class="btn btn-dark" style="flex:1" onclick="closeModal()">إلغاء</button></div>`;
  if(type==='newuser')return`<div class="modal-title">مستخدم جديد</div><div class="hint-gold">يمكن للموظف الدخول من أي مكان بهذا الحساب</div><div class="form-field"><label class="form-label">الاسم *</label><input class="form-input" id="f-name"></div><div class="form-field"><label class="form-label">اسم المستخدم * (إنجليزي)</label><input class="form-input" id="f-uname" dir="ltr"></div><div class="form-field"><label class="form-label">كلمة المرور *</label><input class="form-input" id="f-pw" type="password"></div><div class="form-field"><label class="form-label">الصلاحية</label><select class="form-input" id="f-role"><option value="user">موظف</option><option value="admin">مدير</option></select></div><div style="display:flex;gap:10px"><button class="btn btn-green" style="flex:1" onclick="saveUser()">حفظ</button><button class="btn btn-dark" style="flex:1" onclick="closeModal()">إلغاء</button></div>`;
  return`<div class="modal-title">نموذج</div><button class="btn btn-dark" onclick="closeModal()">إغلاق</button>`;
}

// SAVE FUNCTIONS
function calcPVat(){const a=parseFloat(document.getElementById('f-amount')?.value)||0;const v=a*0.15;const vf=document.getElementById('f-vat');const tf=document.getElementById('f-total');if(vf)vf.value=v.toFixed(2);if(tf)tf.value=(a+v).toFixed(2);}
function calcDVat(){const a=parseFloat(document.getElementById('f-amount')?.value)||0;const v=a*0.15;const vf=document.getElementById('f-vat');const tf=document.getElementById('f-total');if(vf)vf.value=v.toFixed(2);if(tf)tf.value=(a+v).toFixed(2);}
function refreshMBC(){const v=gv('f-bc');const w=document.getElementById('mbc-wrap');if(w)w.style.display=v?'flex':'none';if(v)setTimeout(()=>drawBarcode('mbc',v,200,43),80);}
function saveEmp(id){const name=gv('f-name'),salary=gn('f-salary');if(!name||!salary){notify('يرجى ملء الحقول','error');return;}const e={id:id||Date.now(),name,role:gv('f-role'),salary,housing:gn('f-housing')};if(id)appData.employees=appData.employees.map(x=>x.id===id?e:x);else appData.employees.push(e);closeModal();scheduleSave();renderMain();notify(id?'تم التحديث':'تم إضافة الموظف');}
function saveExp(id){const amount=gn('f-amount');if(!amount){notify('أدخل المبلغ','error');return;}const e={id:id||Date.now(),category:gv('f-cat'),amount,month:gv('f-month'),note:gv('f-note')};if(id)appData.expenses=appData.expenses.map(x=>x.id===id?e:x);else appData.expenses.push(e);closeModal();scheduleSave();renderMain();notify(id?'تم التحديث':'تم إضافة المصروف');}
function saveMat(id){const name=gv('f-name'),qty=gn('f-qty'),uc=gn('f-uc');if(!name||!qty||!uc){notify('يرجى ملء الحقول','error');return;}const m={id:id||Date.now(),name,qty,unit:gv('f-unit'),unitCost:uc,month:gv('f-month')};if(id)appData.rawMaterials=appData.rawMaterials.map(x=>x.id===id?m:x);else appData.rawMaterials.push(m);closeModal();scheduleSave();renderMain();notify(id?'تم التحديث':'تم إضافة المادة');}
function saveRev(id){const source=gv('f-source'),amount=gn('f-amount');if(!source||!amount){notify('يرجى ملء الحقول','error');return;}const r={id:id||Date.now(),source,amount,month:gv('f-month')};if(id)appData.revenue=appData.revenue.map(x=>x.id===id?r:x);else appData.revenue.push(r);closeModal();scheduleSave();renderMain();notify(id?'تم التحديث':'تم إضافة الإيراد');}
function saveRent(){appData.rent={amount:gn('f-amount'),dueDay:gn('f-dueday')||1,note:gv('f-note')};closeModal();scheduleSave();renderMain();notify('تم تحديث الإيجار');}
function saveProd(id){const name=gv('f-name'),price=gn('f-price');if(!name||!price){notify('يرجى ملء الحقول','error');return;}if(!appData.products)appData.products=[];const p={id:id||Date.now(),name,category:gv('f-cat'),unit:gv('f-unit'),price,cost:gn('f-cost'),barcode:gv('f-bc')};if(id)appData.products=appData.products.map(x=>x.id===id?p:x);else appData.products.push(p);closeModal();scheduleSave();renderMain();notify(id?'تم التحديث':'تم إضافة المنتج');}
function saveSale(id){const amount=gn('f-amount'),date=gv('f-date');if(!amount||!date){notify('يرجى ملء الحقول','error');return;}if(!appData.dailySales)appData.dailySales=[];const s={id:id||Date.now(),date,category:gv('f-cat'),amount,note:gv('f-note')};if(id)appData.dailySales=appData.dailySales.map(x=>x.id===id?s:x);else appData.dailySales.push(s);closeModal();scheduleSave();renderMain();notify(id?'تم التحديث':'تم التسجيل');}
function saveEquip(id){const name=gv('f-name'),cost=gn('f-cost');if(!name||!cost){notify('يرجى ملء الحقول','error');return;}if(!appData.equipment)appData.equipment=[];const e={id:id||Date.now(),name,type:gv('f-type'),condition:gv('f-cond'),purchaseCost:cost,maintenanceCost:gn('f-maint'),purchaseDate:gv('f-date'),note:gv('f-note')};if(id)appData.equipment=appData.equipment.map(x=>x.id===id?e:x);else appData.equipment.push(e);closeModal();scheduleSave();renderMain();notify(id?'تم التحديث':'تم إضافة المعدة');}
function savePurchase(){const amount=gn('f-amount'),date=gv('f-date');if(!amount||!date){notify('يرجى ملء الحقول','error');return;}if(!appData.purchases)appData.purchases=[];const vat=amount*0.15;appData.purchases.push({id:Date.now(),date,category:gv('f-cat'),supplier:gv('f-supplier'),amount,vat,total:amount+vat,payMethod:gv('f-pay'),note:gv('f-note')});closeModal();scheduleSave();renderMain();notify('تم حفظ الفاتورة');}
function saveDelivery(){const amount=gn('f-amount'),date=gv('f-date');if(!amount||!date){notify('يرجى ملء الحقول','error');return;}if(!appData.deliveryOrders)appData.deliveryOrders=[];const vat=amount*0.15;appData.deliveryOrders.push({id:Date.now(),date,platform:gv('f-platform'),orderNum:gv('f-ordernum'),customerName:gv('f-customer'),items:gv('f-items'),amount,vat,total:amount+vat,status:gv('f-status')||'new'});closeModal();scheduleSave();renderMain();notify('تم حفظ الطلب');}
async function saveUser(){const name=gv('f-name'),username=gv('f-uname'),password=gv('f-pw');if(!name||!username||!password){notify('يرجى ملء الحقول','error');return;}const r=await apiFetch('/api/users',{method:'POST',body:JSON.stringify({name,username,password,role:gv('f-role')})});if(r?.ok){closeModal();notify('تم إضافة المستخدم');}else notify(r?.error||'خطأ','error');}

// DELETE
function del(type,id){
  if(!confirm('هل تريد الحذف؟'))return;
  const map={employee:'employees',expense:'expenses',material:'rawMaterials',revenue:'revenue',product:'products',sale:'dailySales',equipment:'equipment',purchase:'purchases',deliveryOrder:'deliveryOrders'};
  const key=map[type];if(!key||!appData[key])return;
  appData[key]=appData[key].filter(x=>x.id!==id);
  scheduleSave();renderMain();notify('تم الحذف');
}

// EXPORT EXCEL
function exportExcel(){
  const s=calcStats();const cm=appData.currentMonth;
  const wb=XLSX.utils.book_new();
  const add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name);
  add("الملخص",[["CRMB Bakery"],["التقرير: "+ml(cm)],[],["البند","المبلغ"],["إجمالي الإيرادات",s.totalRev],["رواتب وسكن",s.totalSalaries],["مواد خام",s.totalRaw],["إيجار",appData.rent.amount],["مصاريف",s.totalExp],["إجمالي التكاليف",s.totalCosts],[],[s.netProfit>=0?"صافي الربح":"صافي الخسارة",Math.abs(s.netProfit)],["هامش الربح %",s.margin+"%"]]);
  add("الإيرادات",[["المصدر","الشهر","المبلغ"],...appData.revenue.map(r=>[r.source,ml(r.month),r.amount])]);
  add("الموظفون",[["الاسم","المنصب","الراتب","السكن","الإجمالي"],...appData.employees.map(e=>[e.name,e.role,e.salary,e.housing,e.salary+e.housing])]);
  add("المواد الخام",[["المادة","الكمية","الوحدة","سعر الوحدة","الإجمالي","الشهر"],...appData.rawMaterials.map(r=>[r.name,r.qty,r.unit,r.unitCost,r.qty*r.unitCost,ml(r.month)])]);
  add("المصاريف",[["التصنيف","المبلغ","الشهر","ملاحظة"],...appData.expenses.map(e=>[e.category,e.amount,ml(e.month),e.note||""])]);
  add("المشتريات",[["التاريخ","المورد","الفئة","قبل الضريبة","الضريبة","الإجمالي"],...(appData.purchases||[]).map(p=>[p.date,p.supplier||"",p.category||"",p.amount,p.vat||0,p.total])]);
  add("المبيعات اليومية",[["التاريخ","الفئة","المبلغ","ملاحظة"],...(appData.dailySales||[]).map(s=>[s.date,s.category||"",s.amount,s.note||""])]);
  XLSX.writeFile(wb,`CRMB_${ml(cm).replace(' ','_')}.xlsx`);
  notify('تم تصدير Excel!');
}

// NOTIFY
function notify(msg,type='success'){
  const n=document.getElementById('notif');
  n.textContent=msg;n.style.background=type==='error'?'#c0392b':'#27ae60';
  n.style.display='block';setTimeout(()=>n.style.display='none',3000);
}

// AUTO REFRESH
function startAutoRefresh(){
  setInterval(async()=>{
    const old=JSON.stringify(appData);
    if(await loadData()&&JSON.stringify(appData)!==old){
      if(currentTab==='barcode'){renderMain();setTimeout(drawAllBarcodes,80);}
      else renderMain();
    }
  },15000);
  setInterval(()=>{if(currentTab==='users')loadUsersList();},3000);
}

// MONTH SELECT
function initMonthSelect(){
  const sel=document.getElementById('monthSelect');
  if(sel&&appData)sel.innerHTML=MONTHS.map(m=>`<option value="${m}" ${m===appData.currentMonth?'selected':''}>${ml(m)}</option>`).join('');
}

init();
</script>
